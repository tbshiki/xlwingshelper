[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xlwingshelper"
version = "0.2"
authors = [
  { name="tbshiki", email="info@tbshiki.com" },
]
description = "A helper library for working with Excel using xlwings."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "xlwings",
    "pandas",
]

[project.urls]
"Homepage" = "https://github.com/tbshiki/xlwingshelper"
"Bug Tracker" = "https://github.com/tbshiki/xlwingshelper/issues"

[tool.ruff]
line-length = 88
